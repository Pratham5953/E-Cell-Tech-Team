<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Event Registration - From Idea to Impact</title>

  <link rel="stylesheet" href="reg-style.css">
</head>

<body>

  <div class="registration-container">

    <div class="registration-box">

      <h1>Register for From Idea to Impact</h1>

      <p class="subtitle">
        Oct 25-26, 2025 | BITS Pilani, Hyderabad
      </p>


      <!-- Registration Form -->
      <form id="registrationForm">

        <!-- Full Name -->
        <div class="form-group">
          <label for="name">Full Name *</label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          >

          <span class="error-msg" id="nameError"></span>
        </div>


        <!-- Email -->
        <div class="form-group">
          <label for="email">Email ID *</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="your.email@example.com"
            required
          >

          <span class="error-msg" id="emailError"></span>
        </div>


        <!-- Phone -->
        <div class="form-group">
          <label for="phone">Phone Number (10 digits) *</label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="9876543210"
            maxlength="10"
            required
          >

          <span class="error-msg" id="phoneError"></span>
        </div>


        <!-- College -->
        <div class="form-group">
          <label for="college">College/University Name *</label>

          <input
            type="text"
            id="college"
            name="college"
            placeholder="e.g., BITS Pilani Hyderabad"
            required
          >

          <span class="error-msg" id="collegeError"></span>
        </div>


        <!-- Year -->
        <div class="form-group">
          <label for="year">Year of Study *</label>

          <select id="year" name="year" required>
            <option value="">-- Select Year --</option>
            <option value="1st">1st Year</option>
            <option value="2nd">2nd Year</option>
            <option value="3rd">3rd Year</option>
            <option value="4th">4th Year</option>
            <option value="Masters">Masters</option>
            <option value="Other">Other</option>
          </select>

          <span class="error-msg" id="yearError"></span>
        </div>


        <!-- How they heard about the event -->
        <div class="form-group">
          <label for="source">How did you hear about us? *</label>

          <select id="source" name="source" required>
            <option value="">-- Select Option --</option>
            <option value="instagram">Instagram</option>
            <option value="friend">Friend/Referral</option>
            <option value="college-notice">College Notice</option>
            <option value="email">Email</option>
            <option value="website">Website</option>
            <option value="other">Other</option>
          </select>

          <span class="error-msg" id="sourceError"></span>
        </div>


        <!-- Submit -->
        <button type="submit" class="submit-btn">
          Submit Form
        </button>

      </form>


      <!-- Success message MUST be outside the form -->
      <div class="success-msg" id="successMsg" style="display: none;">
        Registration successful! We'll send confirmation to your email.
      </div>


      <p class="footer-text">
        * Required fields
      </p>

    </div>

  </div>


  <script src="reg-script.js"></script>

</body>
</html>
